  <text x="78" y="155" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="53" font-weight="700">Virat Kumar</text>
  <text x="80" y="205" fill="#b8cfe4" font-family="DejaVu Sans, Arial, sans-serif" font-size="23">Building AI that works.</text>
  <g stroke="url(#line)" stroke-width="2" fill="none" opacity=".65" stroke-linejoin="round">
