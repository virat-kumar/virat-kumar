<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title desc">
  <title id="title">Virat Kumar — Applied AI and agent infrastructure</title>
  <desc id="desc">A dark midnight blue banner with turquoise circuitry and the words Building AI that works.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1025"/>
      <stop offset=".52" stop-color="#101b38"/>
      <stop offset="1" stop-color="#102f41"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
