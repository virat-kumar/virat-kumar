name: Validate public profile
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public README privacy, job history and map
        run: python3 scripts/check_profile.py
      - name: Verify deterministic capability graphic
        run: |
          python3 scripts/generate_capability_map.py
          git diff --exit-code -- assets/capability-map.svg
